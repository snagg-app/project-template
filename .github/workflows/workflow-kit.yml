name: Workflow Kit integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  WORKFLOW_KIT_REF: f428a42bbfa1045716222ce6572314b7e9f44f74
concurrency:
  group: workflow-kit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Workflow Kit integration
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: project/.node-version
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: snagg-app/workflow-kit
          ref: ${{ env.WORKFLOW_KIT_REF }}
          path: workflow-kit
          submodules: recursive
          persist-credentials: false
      - run: node workflow-kit/scripts/init-project.mjs --cwd project --existing
      - run: node workflow-kit/scripts/setup-skills.mjs --cwd project --refresh
      - run: git -C project add --intent-to-add --all && git -C project diff --exit-code HEAD
